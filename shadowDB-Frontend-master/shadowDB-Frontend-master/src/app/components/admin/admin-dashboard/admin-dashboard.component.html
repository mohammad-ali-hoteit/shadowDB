<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <span class="logo-letter">S</span>
        </div>
        <h1 class="logo-text" [class.hidden]="sidebarCollapsed">ShadowDB</h1>
      </div>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg>
      </button>
    </div>
    
    <div class="sidebar-user" [class.compact]="sidebarCollapsed">
      <div class="user-avatar">
        <span>{{ userInitial }}</span>
      </div>
      <div class="user-info" [class.hidden]="sidebarCollapsed">
        <h3 class="user-name">{{ currentUser?.email || 'Admin' }}</h3>
        <p class="user-role">{{ currentUser?.role || 'Administrator' }}</p>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-section">
        <h4 class="nav-title" [class.hidden]="sidebarCollapsed">Management</h4>
        <ul class="nav-items">
          <li class="nav-item">
            <a routerLink="/admin/companies" routerLinkActive="active" class="nav-link" (click)="closeMenuOnMobile()">
              <div class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5 8 5.961 14.154 3.5 8.186 1.113zM15 4.239l-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923l6.5 2.6zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464L7.443.184z"/>
                </svg>
              </div>
              <span [class.hidden]="sidebarCollapsed">Companies</span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/admin/users" routerLinkActive="active" class="nav-link" (click)="closeMenuOnMobile()">
              <div class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1h8zm-7.978-1A.261.261 0 0 1 7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002a.274.274 0 0 1-.014.002H7.022zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM6.936 9.28a5.88 5.88 0 0 0-1.23-.247A7.35 7.35 0 0 0 5 9c-4 0-5 3-5 4 0 .667.333 1 1 1h4.216A2.238 2.238 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816zM4.92 10A5.493 5.493 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275zM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0zm3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
                </svg>
              </div>
              <span [class.hidden]="sidebarCollapsed">Users</span>
            </a>
          </li>
        </ul>
      </div>
      
      <div class="nav-section">
        <h4 class="nav-title" [class.hidden]="sidebarCollapsed">System</h4>
        <ul class="nav-items">
          <li class="nav-item">
            <a class="nav-link" (click)="logout()">
              <div class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                  <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                </svg>
              </div>
              <span [class.hidden]="sidebarCollapsed">Logout</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>
  </aside>
  
  <!-- Backdrop for mobile menu -->
  <div class="sidebar-backdrop" [class.active]="!sidebarCollapsed && isMobile" (click)="closeSidebar()"></div>
  
  <!-- Main Content -->
  <main class="main-content" [class.expanded]="sidebarCollapsed">
    <header class="main-header">
      <div class="header-left">
        <button class="menu-toggle" (click)="toggleSidebar()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
          </svg>
        </button>
        <h2 class="page-title">Admin Dashboard</h2>
      </div>
      
      <div class="header-actions">
        <!-- <div class="action-item">
          <button class="action-button notification-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
            </svg>
            <span class="notification-badge">3</span>
          </button>
        </div> -->
        <!-- <div class="action-item user-menu">
          <div class="user-avatar-small">
            <span>{{ userInitial }}</span>
          </div>
        </div> -->
      </div>
    </header>
    
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
