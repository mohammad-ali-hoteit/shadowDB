<div class="login-page">
  <div class="login-container fade-in">
    <div class="login-branding">
      <div class="brand-logo">
        <div class="logo-icon">
          <span class="logo-letter">S</span>
        </div>
        <h1 class="brand-name">ShadowDB</h1>
      </div>
      <!-- <p class="brand-tagline">Secure Database for Blacklisted Companies</p> -->
      <div class="brand-features">
        <div class="feature-item">
          <span class="feature-icon">🔒</span>
          <span class="feature-text">Secure Access</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">🔍</span>
          <span class="feature-text">Advanced Search</span>
        </div>
      </div>
    </div>
    
    <div class="login-form-container">
      <div class="login-form-wrapper">
        <h2 class="text-center mb-4">Welcome Back</h2>
        <p class="text-center text-secondary mb-4">Login to access your dashboard</p>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-group">
              <div class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757Zm3.436-.586L16 11.801V4.697l-5.803 3.546Z"/>
                </svg>
              </div>
              <input
                type="email"
                id="email"
                formControlName="email"
                class="form-control"
                placeholder="Enter your email"
                [class.is-invalid]="email?.invalid && email?.touched"
              />
            </div>
            <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
              <span *ngIf="email?.errors?.['required']">Email is required</span>
              <span *ngIf="email?.errors?.['email']">Please enter a valid email address</span>
            </div>
          </div>

          <div class="form-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password">Password</label>
              <!-- <a href="#" class="forgot-password">Forgot password?</a> -->
            </div>
            <div class="input-group">
              <div class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                </svg>
              </div>
              <input
                type="password"
                id="password"
                formControlName="password"
                class="form-control"
                placeholder="Enter your password"
                [class.is-invalid]="password?.invalid && password?.touched"
              />
            </div>
            <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
              Password is required
            </div>
          </div>

          <div class="remember-me mb-4">
            <label class="checkbox-container">
              <input type="checkbox" checked="checked">
              <span class="checkmark"></span>
              Remember me
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
            <span>Login to Dashboard</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M4 8a.5.5 0 0 1 .5-.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5A.5.5 0 0 1 4 8z"/>
            </svg>
          </button>

          <div class="login-error" *ngIf="errorMessage">
            <div class="error-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
              </svg>
            </div>
            <span>{{ errorMessage }}</span>
          </div>
        </form>
        
        <!-- <div class="login-footer">
          <p class="text-center mb-0">
            Don't have an account? <a href="#" class="register-link">Contact admin</a>
          </p>
        </div> -->
      </div>
    </div>
  </div>
</div>
